[plugin]
id = "opencad.rilievovani"
name = "Room Survey"
version = "0.15.0-prova.1"
description = "Room survey: adjust a room drawn by eye to the measured sides and diagonals (least squares), with residuals, dimensions and a table of measures. In the 23 languages of Open CAD Studio."
author = "Macchecaspita"
license = "GPL-3.0-only"
repository = "Macchecaspita/opencad-rilievo-plugin"

[opencad]
# Must match API_VERSION exported by the linked ocs_plugin_api.
# Open CAD Studio v2026.47 uses API 28.
api_version = 28
ribbon_order = 61
command_prefixes = ["RV_"]
xdata_apps = []
