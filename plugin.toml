[plugin]
id = "opencad.rilievovani"
name = "Room Survey"
version = "0.9.8"
description = "Room survey: adjust a room drawn by eye to the measured sides and diagonals (least squares), with residuals, dimensions and a table of measures. English, Italian, Spanish, French, Turkish, Portuguese and Polish."
author = "Macchecaspita"
license = "GPL-3.0-only"
repository = "Macchecaspita/opencad-rilievo-plugin"

[opencad]
# Must match API_VERSION exported by the linked ocs_plugin_api.
# Open CAD Studio v2026.45 uses API 16.
api_version = 16
ribbon_order = 61
command_prefixes = ["RV_"]
xdata_apps = []
